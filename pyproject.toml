[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "vxn-ramnet"
version = "0.3.0"
description = "Camera-based visual route-memory research prototype for the constrained VXN-RAMNet backtracking experiment"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "VXN-RAMNet contributors" }]
keywords = ["computer-vision", "route-memory", "assistive-technology-research", "offline-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=10,<13",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
vision = ["tensorflow>=2.15,<3"]
ui = ["streamlit>=1.34,<2"]
research = [
  "jupyterlab>=4,<5",
  "matplotlib>=3.8,<4",
  "pandas>=2.1,<3",
  "scikit-learn>=1.3,<2",
  "tqdm>=4.66,<5",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
vxn-ramnet = "vxn_ramnet.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vxn_ramnet = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: tests multiple package layers",
  "regression: protects verified baseline behavior",
  "vision: requires TensorFlow or a visual model",
]

[tool.coverage.run]
branch = true
source = ["vxn_ramnet"]
omit = [
  "src/vxn_ramnet/vision/encoders/efficientnet.py",
  "src/vxn_ramnet/cli.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
exclude = ["research/notebooks"]

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["research/notebooks"]
